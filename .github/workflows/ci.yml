name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Soroban contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target
      - name: Format
        run: cargo fmt --all -- --check
        working-directory: contracts
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: contracts
      - name: Test
        run: cargo test --workspace
        working-directory: contracts
      - name: Release build
        run: cargo build --release --target wasm32v1-none
        working-directory: contracts

  sdk:
    name: SDK, docs, deployment manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @looptag/sdk build
      - name: Typecheck
        run: pnpm --filter @looptag/sdk typecheck
      - name: Test
        run: pnpm --filter @looptag/sdk test
      - name: Format check
        run: pnpm --filter @looptag/sdk format:check
      - name: Docs links
        run: pnpm check:docs
      - name: Deployment manifest
        run: pnpm check:deployments
      - name: Secret and large-file hygiene
        run: pnpm check:hygiene
